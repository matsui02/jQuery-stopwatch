<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>ストップウォッチ</title>
    <link rel="stylesheet" href="main.css" />
    <!-- jQuery を使う場合は読み込む -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <h3>ストップウォッチ</h3>
    <!-- ここに表示部分とボタンを書いていきましょう -->
    <div class="result" id="result"></div>

    <button type="button" class="button" id="startBtn" >スタート</button>
    <button type="button" class="button" id="stopBtn">ストップ</button>
    <button type="button" class="button" id="resetBtn">リセット</button>
    <script src="main.js"></script>
  </body>
</html>
